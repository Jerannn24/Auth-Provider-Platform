services:
  postgres-db:
    image: postgres:18.3
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-global-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  db-global:
    build: 
      context: ./auth-provider/db
    container_name: db-global
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres-db:
        condition: service_healthy

  server:
    build:
      context: ./auth-provider/server
    container_name: server
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?schema=public
    ports:
      - "8080:8000"
    volumes:
      - ./auth-provider/server:/usr/src/app
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  db-global-data: